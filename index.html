<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1220">
<meta name="description" content="A free, offline rehab tracker for meniscus tears managed without surgery: staged program, pain rules, timers and a physio summary. Your data stays on your device.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knee Rehab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Meniscus Rehab Tracker</title>
<style>
:root{
  --bg:#0A1220; --bg2:#0D182B; --card:#12213A; --card2:#15284A; --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.26);
  --text:#EAF0F8; --muted:#A3B3C9; --dim:#7586A0;
  --gold:#D9AE4F; --gold2:#F0CB78; --goldbg:rgba(217,174,79,.13); --ink:#141004;
  --green:#3CC08A; --amber:#F0A23B; --red:#EF5B5B; --blue:#6CC3F5;
  --greenbg:rgba(60,192,138,.13); --amberbg:rgba(240,162,59,.13); --redbg:rgba(239,91,91,.13); --bluebg:rgba(108,195,245,.12);
  --s1:#3987E5; --s2:#BF8A22;
  --r:18px; --r2:13px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(900px 520px at 50% -180px,#1B2E52 0%,rgba(10,18,32,0) 70%);background-attachment:fixed;
  color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
a{color:var(--gold2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(10,18,32,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:var(--st)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.mark{width:26px;height:26px;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:15.5px;letter-spacing:-.01em}
.brand span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);position:relative}
.iconbtn svg{width:22px;height:22px}
.iconbtn:active{background:rgba(255,255,255,.06)}
.cloud{position:absolute;right:7px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 2px var(--bg)}
.cloud.ok{background:var(--green)}.cloud.busy{background:var(--gold)}.cloud.off{background:var(--amber)}

main{padding:14px 0 calc(92px + var(--sb))}
.view{display:flex;flex-direction:column;gap:12px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,18,32,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:62px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11.5px;font-weight:600}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--gold)}

/* cards */
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tight{padding:12px 14px}
.card h2{margin:0;font-size:17px;letter-spacing:-.01em}
.card h3{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ch .grow{flex:1;min-width:0}
.ch small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:4px 9px;border-radius:999px;background:var(--goldbg);color:var(--gold2);white-space:nowrap}
.badge.g{background:var(--greenbg);color:#7FE0B5}.badge.a{background:var(--amberbg);color:#FFC57A}.badge.r{background:var(--redbg);color:#FF9C9C}.badge.b{background:var(--bluebg);color:#A9DDFB}.badge.n{background:rgba(255,255,255,.06);color:var(--muted)}
.sicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--goldbg);color:var(--gold2);flex:none}
.sicon.b{background:var(--bluebg);color:var(--blue)}
.sicon svg{width:21px;height:21px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.small{font-size:13px}.tiny{font-size:12px}
p{margin:6px 0}
.sp{height:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:var(--r2);font-weight:650;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--text)}
.btn:active{transform:scale(.985)}
.btn.gold{background:linear-gradient(180deg,#E2B85B,#C99A36);border-color:transparent;color:var(--ink)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--gold2)}
.btn.danger{border-color:rgba(239,91,91,.45);color:#FF9C9C}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.link{color:var(--gold2);font-weight:600;font-size:13.5px}

/* exercise rows */
.list{display:flex;flex-direction:column;margin:0 -6px}
.ex{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;min-height:58px}
.ex:active{background:rgba(255,255,255,.04)}
.ex+.ex{border-top:1px solid var(--line)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent}
.chk svg{width:17px;height:17px}
.chk.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.chk.lock{border-style:dashed;color:var(--dim)}
.ex .t{flex:1;min-width:0;text-align:left}
.ex .t b{display:block;font-weight:620;font-size:15px;line-height:1.25}
.ex .t span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ex>svg{width:18px;height:18px;flex:none;color:var(--dim)}
.ex .th{width:64px;height:40px;flex:none;border-radius:9px;background:rgba(0,0,0,.18);overflow:hidden}
.ex .th svg{width:100%;height:100%}
.ex.done .t b{color:var(--muted)}
.ex.locked .t b{color:var(--muted)}
.ex .hurt{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-left:6px;vertical-align:middle}
.alt{font-size:12px;color:var(--gold2)}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.banner .bi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.banner .bi svg{width:18px;height:18px}
.banner b{display:block;font-size:15px}
.banner p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.banner.g{background:var(--greenbg);border-color:rgba(60,192,138,.28)}.banner.g .bi{background:rgba(60,192,138,.2);color:#7FE0B5}
.banner.a{background:var(--amberbg);border-color:rgba(240,162,59,.3)}.banner.a .bi{background:rgba(240,162,59,.2);color:#FFC57A}
.banner.r{background:var(--redbg);border-color:rgba(239,91,91,.35)}.banner.r .bi{background:rgba(239,91,91,.2);color:#FF9C9C}
.banner.k{background:var(--goldbg);border-color:rgba(217,174,79,.3)}.banner.k .bi{background:rgba(217,174,79,.2);color:var(--gold2)}
.banner.b{background:var(--bluebg);border-color:rgba(108,195,245,.28)}.banner.b .bi{background:rgba(108,195,245,.2);color:var(--blue)}

/* date nav */
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dnav .d{font-weight:700;font-size:20px;letter-spacing:-.015em}
.dnav .sub{font-size:13px;color:var(--muted)}
.dnav .arrows{display:flex;gap:4px}
.pillnav{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.pillnav[disabled]{opacity:.35}

/* progress bar */
.prog{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#C99A36,#F0CB78);border-radius:99px}

/* chips & segmented */
.pain{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.pain button{height:40px;border-radius:10px;font-weight:700;font-size:14px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.pain button.z0{color:#7FE0B5}.pain button.z1{color:#FFC57A}.pain button.z2{color:#FF9C9C}
.pain button.on.z0{background:var(--green);color:#06210F;border-color:transparent}
.pain button.on.z1{background:var(--amber);color:#2A1700;border-color:transparent}
.pain button.on.z2{background:var(--red);color:#2B0606;border-color:transparent}
.zlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-top:5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;min-height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-weight:620;font-size:14px}
.seg button.on{background:var(--goldbg);border-color:var(--gold);color:var(--gold2)}
.seg.c button.on.g{background:var(--greenbg);border-color:var(--green);color:#7FE0B5}
.seg.c button.on.a{background:var(--amberbg);border-color:var(--amber);color:#FFC57A}
.seg.c button.on.r{background:var(--redbg);border-color:var(--red);color:#FF9C9C}
.q{margin:14px 0 8px;font-weight:650;font-size:14.5px}
.q small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;background:rgba(0,0,0,.22);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--gold)}
textarea{min-height:76px;resize:vertical}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,7,14,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:94vh;display:flex;flex-direction:column;background:#0F1C33;border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto;box-shadow:0 -20px 50px rgba(0,0,0,.4)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;flex:none}
.sheet .sh h2{flex:1;margin:0;font-size:18px;letter-spacing:-.01em}
.sheet .sh h2 small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.sheet .sb{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(20px + var(--sb));overscroll-behavior:contain}
.sheet .sf{padding:10px 16px calc(12px + var(--sb));border-top:1px solid var(--line);flex:none;background:#0F1C33}
.close{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;color:var(--muted)}
.close svg{width:18px;height:18px}

/* exercise sheet */
.figbox{border-radius:16px;background:radial-gradient(120% 90% at 50% 0%,#1A2F55,#0E1A30);border:1px solid var(--line);position:relative;overflow:hidden}
.figbox svg{display:block;width:100%;height:auto;aspect-ratio:1.6/1}
.figcap{position:absolute;left:10px;top:8px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.figcap i{width:14px;height:4px;border-radius:3px;background:#E3B04B;display:inline-block}
.dose{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.dose b{font-size:24px;letter-spacing:-.02em}
.dose span{color:var(--muted);font-size:13.5px}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.setb{min-width:58px;height:46px;border-radius:12px;border:1.5px solid var(--line2);font-weight:700;font-size:14px;color:var(--muted);padding:0 10px}
.setb.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);font-size:20px;font-weight:600}
.stepper output{min-width:76px;text-align:center;font-weight:700;font-size:18px}
.cues{margin:8px 0 0;padding:0;list-style:none;counter-reset:c}
.cues li{counter-increment:c;display:flex;gap:10px;padding:7px 0;font-size:14.5px}
.cues li:before{content:counter(c);flex:none;width:22px;height:22px;border-radius:50%;background:var(--goldbg);color:var(--gold2);font-weight:700;font-size:12px;display:grid;place-items:center;margin-top:1px}
.note{border-left:3px solid var(--gold);background:var(--goldbg);border-radius:0 12px 12px 0;padding:10px 12px;font-size:13.5px;margin-top:10px}
.note.k{border-color:#B98CE8;background:rgba(185,140,232,.1)}
.note.r{border-color:var(--red);background:var(--redbg)}
.note.b{border-color:var(--blue);background:var(--bluebg)}
.note b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;color:var(--muted)}

/* timer */
.timer{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
.ring{position:relative;width:208px;height:208px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ph{font-size:13px;font-weight:800;letter-spacing:.14em}
.ring .big{font-size:52px;font-weight:750;letter-spacing:-.03em;line-height:1.05}
.ring .rep{font-size:13px;color:var(--muted)}
.tctl{display:flex;gap:10px;margin-top:12px;width:100%}
.tctl .btn{flex:1}
.tpill{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + var(--st));z-index:30;background:#173057;border:1px solid var(--gold);color:var(--text);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}

/* misc */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.gate li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.gate li:first-child{border-top:0}
.gate ul{list-style:none;margin:0;padding:0}
.gi{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line2);margin-top:1px}
.gi svg{width:14px;height:14px}
.gi.ok{background:var(--green);border-color:var(--green);color:#06210F}
.gi.auto{border-style:dotted}
.gate .why{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.steps{display:flex;gap:6px}
.steps button{flex:1;border-radius:12px;padding:9px 4px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:center}
.steps button b{display:block;font-size:15px}
.steps button span{display:block;font-size:11px;color:var(--muted)}
.steps button.cur{border-color:var(--gold);background:var(--goldbg)}
.steps button.cur b{color:var(--gold2)}
.steps button.past{opacity:.7}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk div{text-align:center;border-radius:11px;padding:8px 2px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.wk div b{display:block;font-size:12px;color:var(--text);margin-bottom:3px}
.wk div.today{border-color:var(--gold)}
.wk svg{width:18px;height:18px;display:block;margin:0 auto 2px;color:var(--gold2)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lib button{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:6px;text-align:left}
.lib button svg{width:100%;height:auto;display:block;border-radius:9px;background:rgba(0,0,0,.18)}
.lib button b{display:block;font-size:13px;padding:6px 4px 2px;line-height:1.25}
.lib button span{display:block;font-size:11.5px;color:var(--muted);padding:0 4px 3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--dim);text-align:center}
.cal .c{aspect-ratio:1/1;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted)}
.cal .c.today{border-color:var(--gold);color:var(--text)}
.cal .c.fut{opacity:.35}
.cal .dots{display:flex;gap:3px;height:6px}
.cal .dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#0B1528;border:1px solid var(--line2);border-radius:10px;padding:7px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tip b{display:block;font-size:12px;color:var(--text)}
details.acc{border-top:1px solid var(--line)}
details.acc:first-of-type{border-top:0}
details.acc summary{list-style:none;cursor:pointer;padding:12px 0;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary:after{content:"";width:9px;height:9px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);margin-right:4px;transition:transform .2s}
details.acc[open] summary:after{transform:rotate(-135deg)}
details.acc .body{padding:0 0 12px;font-size:14px;color:#D6DEEA}
.body ul{margin:4px 0;padding-left:18px}.body li{margin:3px 0}
.tl{display:flex;height:30px;border-radius:9px;overflow:hidden;font-size:12px;font-weight:700}
.tl div{display:flex;align-items:center;justify-content:center}
.hist{border-top:1px solid var(--line);padding:10px 0}
.hist:first-child{border-top:0}
.hist .hd{display:flex;justify-content:space-between;gap:8px;font-weight:650;font-size:14px}
.hist .bd{font-size:13px;color:var(--muted);margin-top:3px}
.toast{position:fixed;left:50%;bottom:calc(78px + var(--sb));transform:translateX(-50%) translateY(20px);z-index:60;background:#1B3157;border:1px solid var(--line2);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.dlg{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:rgba(3,7,14,.66)}
.dlg .box{background:#12223D;border:1px solid var(--line2);border-radius:18px;padding:18px;max-width:420px;width:100%}
.dlg h3{margin:0 0 6px;font-size:17px}
.dlg p{color:var(--muted);font-size:14px}

</style>
</head>
<body>
<noscript><p style="padding:24px;color:#EAF0F8;font-family:system-ui">This app needs JavaScript turned on.</p></noscript>
<div id="app"></div>
<script>
/* ===== Figure engine: animated stick figures, 2-bone IK, left leg highlighted ===== */
const Fig = (() => {
  const LEN = { thigh: 30, shin: 30, uarm: 20, farm: 19, headR: 7.5, neck: 12 };
  const G = 142;
  const D = Math.PI / 180;
  const C = {
    body: '#D5DEEA', far: '#62738F', left: '#E3B04B',
    floor: '#2C3F5F', prop: '#1C2D4A', propHi: '#33507E', propLine: '#5A77A6',
    water: 'rgba(56,150,214,.17)', waterLine: 'rgba(130,200,245,.8)',
    band: '#E8875A', ice: '#A6DDF9', strap: '#C9D4E3', weight: '#8A7444', bell: '#8D9BB1'
  };
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const mul = (a, k) => [a[0] * k, a[1] * k];
  const len = (a) => Math.hypot(a[0], a[1]);
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const rot = (v, ang) => { const c = Math.cos(ang * D), s = Math.sin(ang * D); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c]; };
  const f1 = (n) => Math.round(n * 10) / 10;
  const P2 = (p) => f1(p[0]) + ',' + f1(p[1]);

  function ik(root, end, l1, l2, sign) {
    const v = sub(end, root);
    let d = len(v);
    const th0 = Math.atan2(v[1], v[0]);
    if (d >= l1 + l2 - 0.01) {
      const u = [Math.cos(th0), Math.sin(th0)];
      return [add(root, mul(u, l1)), add(root, mul(u, l1 + l2))];
    }
    d = Math.max(d, Math.abs(l1 - l2) + 0.5);
    const a = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
    const th = th0 + sign * a;
    return [add(root, [Math.cos(th) * l1, Math.sin(th) * l1]), end];
  }

  function solve(q) {
    const P = { hip: q.hip, sh: q.sh };
    P.lhp = q.lhp || q.hip; P.rhp = q.rhp || q.hip;
    P.lsh = q.lsh || q.sh; P.rsh = q.rsh || q.sh;
    P.pm = mid(P.lhp, P.rhp); P.sm = mid(P.lsh, P.rsh);
    if (q.hd) P.head = q.hd;
    else { const v = sub(P.sm, P.pm); const n = len(v) || 1; P.head = add(P.sm, mul(v, LEN.neck / n)); }
    ['l', 'r'].forEach((s) => {
      let knee, ank;
      if (q[s + 'kn']) { knee = q[s + 'kn']; ank = q[s + 'a']; }
      else if (q.straight) { ank = q[s + 'a']; knee = mid(P[s + 'hp'], ank); }
      else { [knee, ank] = ik(P[s + 'hp'], q[s + 'a'], LEN.thigh, LEN.shin, q[s + 'k'] ?? -1); }
      P[s + 'knee'] = knee; P[s + 'ank'] = ank;
      const fa = q[s + 'f'] ?? 0, fl = q.flen ?? 1;
      P[s + 'heel'] = add(ank, rot([-1 * fl, 3 * fl], fa));
      P[s + 'toe'] = add(ank, rot([9 * fl, 3 * fl], fa));
      if (q[s + 'h']) {
        let elb, hand;
        if (q[s + 'el']) { elb = q[s + 'el']; hand = q[s + 'h']; }
        else { [elb, hand] = ik(P[s + 'sh'], q[s + 'h'], LEN.uarm, LEN.farm, q[s + 'e'] ?? 1); }
        P[s + 'elb'] = elb; P[s + 'hand'] = hand;
      }
    });
    P.lthigh = mid(P.lhp, P.lknee); P.lcalf = mid(P.lknee, P.lank);
    return P;
  }

  const rect = (x, y, w, h, fill, rx = 2, stroke, sw = 1.2) =>
    `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${rx}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${sw}"` : ''}/>`;
  const line = (a, b, col, w, extra = '') =>
    `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${extra}/>`;
  const circ = (c, r, fill, stroke, sw = 1.2, extra = '') =>
    `<circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="${r}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${sw}"` : ''}${extra}/>`;
  const poly = (pts, col, w, extra = '') =>
    `<polyline points="${pts.map(P2).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${extra}/>`;
  const at = (P, v) => (typeof v === 'string' ? P[v] : v);

  const PROP = {
    floor: () => line([6, G], [234, G], C.floor, 2),
    mat: (pr) => rect(pr.x ?? 34, G - 3.5, pr.w ?? 172, 3.5, '#20375A', 1.5),
    roll: (pr) => circ(pr.at, pr.r, C.propHi, C.propLine) + circ(pr.at, pr.r * 0.45, 'none', C.propLine, 1),
    cuff: (pr, P) => { const a = P.lank; return `<g opacity="${pr.op ?? 1}">${rect(a[0] - 4.5, a[1] - 4, 9, 8, C.weight, 2.5, '#C9A55A', 1)}</g>`; },
    strap: (pr, P) => line(at(P, pr.from), at(P, pr.to), C.strap, 1.8),
    wall: (pr) => rect(pr.x, 6, 9, G - 6, '#15243D', 0) + line([pr.x, 6], [pr.x, G], C.propLine, 1.4),
    rail: (pr) => line([pr.x, pr.top], [pr.x, G], C.propLine, 3) + line([pr.x - 8, pr.top], [pr.x + 5, pr.top], C.propLine, 3.5) + line([pr.x - 7, G], [pr.x + 7, G], C.propLine, 3),
    post: (pr) => rect(pr.x - 3, pr.top, 6, G - pr.top, C.propHi, 1.5, C.propLine, 1),
    band: (pr, P) => line(at(P, pr.from), at(P, pr.to), C.band, 2.4),
    step: (pr) => rect(pr.x, G - pr.h, pr.w, pr.h, C.propHi, 2, C.propLine),
    pad: (pr) => rect(pr.x, G - pr.h, pr.w, pr.h, '#2D4570', 3, C.propLine),
    pillow: (pr) => rect(pr.x, pr.y, pr.w, pr.h, '#2A4066', 6, C.propLine, 1),
    chair: (pr) => {
      const x = pr.x, sy = pr.y ?? 108, w = pr.w ?? 28;
      return rect(x, sy, w, 4, C.propHi, 1.5, C.propLine, 1) + line([x + 3, sy + 4], [x + 3, G], C.propLine, 2.4) +
        line([x + w - 3, sy + 4], [x + w - 3, G], C.propLine, 2.4) + line([x + 1.5, sy], [x - 1, sy - 40], C.propLine, 3.2);
    },
    box: (pr) => rect(pr.x, pr.y, pr.w, G - pr.y, C.propHi, 2, C.propLine),
    ledge: (pr) => rect(0, pr.y - 5, 240, 5, '#22385B', 0) + line([0, pr.y], [240, pr.y], C.propLine, 1.2),
    water: (pr) => {
      const y = pr.y, bottom = pr.bottom ?? G;
      let d = `M0,${y}`;
      for (let x = 0; x <= 240; x += 20) d += ` Q${x + 5},${y - 2.2} ${x + 10},${y} T${x + 20},${y}`;
      return `<path d="${d} L240,${bottom} L0,${bottom} Z" fill="${C.water}"/><path d="${d}" fill="none" stroke="${C.waterLine}" stroke-width="1.4"/>`;
    },
    ice: (pr, P) => {
      const k = P.lknee;
      return rect(k[0] - 8, k[1] - 9.5, 16, 8, C.ice, 3, '#E6F6FF', 1) +
        line([k[0] - 4, k[1] - 13], [k[0] - 2, k[1] - 16], '#A6DDF9', 1.2) + line([k[0] + 1, k[1] - 13], [k[0] + 3, k[1] - 17], '#A6DDF9', 1.2) +
        line([k[0] + 6, k[1] - 13], [k[0] + 8, k[1] - 16], '#A6DDF9', 1.2);
    },
    slider: (pr, P) => { const h = P[pr.on]; return `<ellipse cx="${f1(h[0])}" cy="${G - 1.6}" rx="6" ry="1.9" fill="#6A7FA3"/>`; },
    dumbbell: (pr, P) => {
      const h = P[pr.on];
      return `<g opacity="${pr.far ? 0.55 : 1}">${rect(h[0] - 1.5, h[1] - 1, 3, 9, C.bell, 1)}${rect(h[0] - 5, h[1] + 7, 10, 4.5, '#6E7D95', 1.5)}${rect(h[0] - 5, h[1] - 5, 10, 4.5, '#6E7D95', 1.5)}</g>`;
    },
    goblet: (pr, P) => { const h = mid(P.lhand, P.rhand || P.lhand); return rect(h[0] - 4, h[1] - 9, 8, 18, C.bell, 3, '#B4C0D2', 1); },
    bench: (pr) => rect(pr.x, pr.y, pr.w, 5, C.propHi, 2, C.propLine, 1) + line([pr.x + 6, pr.y + 5], [pr.x + 6, G], C.propLine, 2.4) + line([pr.x + pr.w - 6, pr.y + 5], [pr.x + pr.w - 6, G], C.propLine, 2.4),
    curlpad: (pr, P) => {
      const k = P.lknee, a = P.lank, th = Math.atan2(a[1] - k[1], a[0] - k[0]) - Math.PI / 2;
      const c = add(a, [Math.cos(th) * 7, Math.sin(th) * 7]);
      return circ(c, 5, '#3A5683', '#5E7BA8', 1.2);
    },
    legpress: (pr, P) => {
      const a = P.lank;
      const px = a[0] + 6;
      let s = '';
      s += line([64, G - 1], [222, G - 1], C.propLine, 3);
      s += line([150, 118], [222, 118], C.propLine, 3) + line([216, 118], [216, G], C.propLine, 3);
      s += line([96, 113], [96, G], C.propLine, 3);
      s += rect(82, 108, 34, 6, C.propHi, 3, C.propLine, 1);
      s += line([92, 107], [76, 62], '#2F4670', 8);
      s += rect(px, a[1] - 24, 5, 38, '#3A5683', 2, '#5E7BA8', 1);
      s += line([px + 5, a[1] - 3], [178, a[1] - 3], C.propLine, 2.2) + line([px + 5, a[1] + 8], [178, a[1] + 8], C.propLine, 2.2);
      return s;
    },
    abd: (pr, P) => {
      let s = rect(97, 50, 26, 47, '#22375A', 4);
      s += rect(88, 99, 44, 7, C.propHi, 3, C.propLine, 1);
      s += line([110, 106], [110, G], C.propLine, 3) + line([86, 135], [134, 135], C.propLine, 3);
      return s;
    },
    abdpads: (pr, P) => rect(P.lknee[0] + 2.5, P.lknee[1] - 7, 5, 13, '#3A5683', 2, '#5E7BA8', 1) + rect(P.rknee[0] - 7.5, P.rknee[1] - 7, 5, 13, '#3A5683', 2, '#5E7BA8', 1),
    bike: (pr, P, q) => {
      const c = [122, 118];
      let s = '';
      s += line([78, G - 1], [170, G - 1], C.propLine, 3.2);
      s += line([98, G - 1], [105, 80], C.propLine, 3.6);
      s += rect(94, 76, 22, 4.5, C.propHi, 2.2, C.propLine, 1);
      s += line([104, 94], c, C.propLine, 3);
      s += line([152, G - 1], [150, 57], C.propLine, 3.6) + line([142, 56], [156, 56], C.propLine, 3.6);
      s += circ([152, 114], 15, 'none', C.propLine, 2.2);
      s += circ(c, 11, 'none', 'rgba(140,160,190,.3)', 1, ' stroke-dasharray="2 3"');
      const lp = q.lpedal || c, rp = q.rpedal || c;
      s += line(c, rp, C.propLine, 2.6) + line(c, lp, '#5A759F', 2.6) + circ(c, 2.6, C.propLine);
      return s;
    },
    cones: () => '',
  };

  function codPath(p) {
    // figure-8 (lemniscate of Gerono) across two cones
    const t = p * 2 * Math.PI;
    return [120 + 78 * Math.sin(t), 82 + 34 * Math.sin(t) * Math.cos(t)];
  }

  function drawPath(q) {
    let s = line([6, 132], [234, 132], C.floor, 1.5, ' stroke-dasharray="1 5"');
    let d = '';
    for (let i = 0; i <= 64; i++) { const pt = codPath(i / 64); d += (i ? ' L' : 'M') + P2(pt); }
    s += `<path d="${d}" fill="none" stroke="rgba(213,222,234,.35)" stroke-width="1.6" stroke-dasharray="3 4"/>`;
    [[64, 82], [176, 82]].forEach((c) => { s += `<path d="M${c[0] - 7},${c[1] + 8} L${c[0]},${c[1] - 10} L${c[0] + 7},${c[1] + 8} Z" fill="#E8875A"/>`; });
    for (let k = 6; k >= 1; k--) { const pt = codPath((q._p - k * 0.012 + 1) % 1); s += circ(pt, 2.2, C.left, null, 0, ` opacity="${(0.12 * (7 - k)).toFixed(2)}"`); }
    s += circ(codPath(q._p), 5.5, C.left, '#0B1424', 1.5);
    return s;
  }

  function draw(q, props) {
    if (q.mode === 'path') return drawPath(q);
    const P = solve(q);
    const back = [], fore = [];
    (props || []).forEach((pr) => { const fn = PROP[pr.t]; if (!fn) return; (pr.front ? fore : back).push(fn(pr, P, q)); });
    let s = back.join('');
    if (q.glow > 0.02 && q.glowAt) {
      const g = add(typeof q.glowAt === 'string' ? P[q.glowAt] : q.glowAt, q.glowOff || [0, 0]);
      s += circ(g, 14, `url(#${q.glowCol === 'blue' ? 'figGlowB' : 'figGlow'})`, null, 0, ` opacity="${f1(Math.min(1, q.glow))}"`);
    }
    const legR = () => poly([P.rhp, P.rknee, P.rank], C.far, 6) + poly([P.rank, P.rheel, P.rtoe], C.far, 4);
    const legL = () => poly([P.lhp, P.lknee, P.lank], C.left, 6.5) + poly([P.lank, P.lheel, P.ltoe], C.left, 4.2);
    const armR = () => (P.rhand ? poly([P.rsh, P.relb, P.rhand], C.far, 5) : '');
    const armL = () => (P.lhand ? poly([P.lsh, P.lelb, P.lhand], C.body, 5) : '');
    const torso = () => {
      let t = poly([P.pm, P.sm], C.body, 9.5);
      if (q.lhp || q.rhp) t += poly([P.lhp, P.rhp], C.body, 7);
      if (q.lsh || q.rsh) t += poly([P.lsh, P.rsh], C.body, 7);
      return t;
    };
    const head = circ(P.head, LEN.headR, C.body);
    if (q.order === 'leftBehind') s += legL() + armR() + legR() + torso() + head + armL();
    else s += armR() + legR() + torso() + head + legL() + armL();
    s += fore.join('');
    s += circ(P.lknee, 6.4, 'none', C.left, 1.3, ' opacity=".9" stroke-dasharray="2.2 1.6"');
    return s;
  }

  const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * t);
  function lerpQ(a, b, t) {
    const o = {};
    const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
    keys.forEach((k) => {
      const va = a[k], vb = b[k];
      if (Array.isArray(va) && Array.isArray(vb)) o[k] = [va[0] + (vb[0] - va[0]) * t, va[1] + (vb[1] - va[1]) * t];
      else if (typeof va === 'number' && typeof vb === 'number') o[k] = va + (vb - va) * t;
      else o[k] = t < 0.5 ? (va ?? vb) : (vb ?? va);
    });
    return o;
  }
  function poseAt(spec, time) {
    if (spec.gen) { const p = ((time / (spec.period || 1.2)) % 1 + 1) % 1; const q = spec.gen(p); q._p = p; return q; }
    const keys = spec.keys;
    if (keys.length === 1) return keys[0].p;
    let total = 0;
    keys.forEach((k) => { total += (k.hold ?? 0.6) + (k.move ?? 1); });
    let t = time % total;
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i], h = k.hold ?? 0.6, m = k.move ?? 1;
      if (t < h) return k.p;
      t -= h;
      if (t < m) return lerpQ(k.p, keys[(i + 1) % keys.length].p, ease(t / m));
      t -= m;
    }
    return keys[0].p;
  }
  function staticPose(spec, which) {
    if (spec.gen) { const p = which === 'a' ? 0 : spec.thumbP ?? 0.25; const q = spec.gen(p); q._p = p; return q; }
    if (which === 'a') return spec.keys[0].p;
    const i = spec.thumb ?? (spec.keys.length > 2 ? spec.keys.length - 1 : 1);
    return spec.keys[Math.min(i, spec.keys.length - 1)].p;
  }
  const PROPB = {
    step: (p) => [[p.x - 2, G - p.h - 2], [p.x + p.w + 2, G]], box: (p) => [[p.x - 2, p.y - 2], [p.x + p.w + 2, G]], pad: (p) => [[p.x, G - p.h], [p.x + p.w, G]],
    chair: (p) => [[p.x - 3, (p.y ?? 108) - 42], [p.x + (p.w ?? 28) + 2, G]], wall: (p) => [[p.x + 10, 70]], rail: (p) => [[p.x + 7, p.top - 2]],
    post: (p) => [[p.x + 5, p.top - 2]], pillow: (p) => [[p.x - 2, p.y - 2], [p.x + p.w + 2, p.y + p.h]], roll: (p) => [[p.at[0] - p.r - 2, p.at[1] - p.r - 2], [p.at[0] + p.r + 2, p.at[1] + p.r]],
    bench: (p) => [[p.x - 2, p.y - 2], [p.x + p.w + 2, G]], abd: () => [[86, 48], [134, G]], bike: () => [[76, 52], [170, G]], legpress: () => [[70, 58], [184, G]],
  };
  const VBS = new WeakMap();
  function fitBox(spec) {
    if (spec.vb) return spec.vb;
    if (VBS.has(spec)) return VBS.get(spec);
    const qs = spec.gen ? [0, 0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875].map((p) => { const q = spec.gen(p); q._p = p; return q; }) : spec.keys.map((k) => k.p);
    let vb;
    if (qs[0].mode === 'path') vb = '0 7 240 150';
    else {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      const inc = (pt, r = 0) => { if (!pt) return; x0 = Math.min(x0, pt[0] - r); y0 = Math.min(y0, pt[1] - r); x1 = Math.max(x1, pt[0] + r); y1 = Math.max(y1, pt[1] + r); };
      qs.forEach((q) => { const P = solve(q); ['hip', 'sh', 'lknee', 'rknee', 'lank', 'rank', 'lheel', 'rheel', 'ltoe', 'rtoe', 'lelb', 'relb', 'lhand', 'rhand', 'lhp', 'rhp', 'lsh', 'rsh'].forEach((k) => inc(P[k], 4)); inc(P.head, LEN.headR + 2); });
      (spec.props || []).forEach((p) => { const f = PROPB[p.t]; if (f) f(p).forEach((pt) => inc(pt)); });
      const floor = (spec.props || []).some((p) => p.t === 'floor');
      x0 -= 12; x1 += 12; y0 -= 10; y1 += 4;
      if (floor) y1 = Math.max(y1, G + 5);
      const A = 1.6; let w = x1 - x0, h = y1 - y0;
      if (w / h > A) { const nh = w / A; y0 -= nh - h; h = nh; } else { const nw = h * A; x0 -= (nw - w) / 2; w = nw; }
      const minW = 240 / 1.8;
      if (w < minW) { const nw = minW, nh = nw / A; x0 -= (nw - w) / 2; y0 -= nh - h; w = nw; h = nh; }
      if (floor) y0 = G + 5 - h;
      vb = `${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;
    }
    VBS.set(spec, vb);
    return vb;
  }
  function svgString(spec, which, cls) {
    return `<svg class="${cls || 'fig'}" viewBox="${fitBox(spec)}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${draw(staticPose(spec, which), spec.props)}</svg>`;
  }
  function defs() {
    return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="figGlow"><stop offset="0" stop-color="#F2C35B" stop-opacity=".75"/><stop offset="1" stop-color="#F2C35B" stop-opacity="0"/></radialGradient>
<radialGradient id="figGlowB"><stop offset="0" stop-color="#8FD3F7" stop-opacity=".8"/><stop offset="1" stop-color="#8FD3F7" stop-opacity="0"/></radialGradient>
</defs></svg>`;
  }
  function mount(el, spec, opts = {}) {
    el.innerHTML = `<svg class="fig" viewBox="${fitBox(spec)}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${opts.label || ''}"></svg>`;
    const s = el.firstChild;
    let reduce = false;
    try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduce = false; }
    if (reduce || opts.still) { s.innerHTML = draw(staticPose(spec, 'b'), spec.props); return () => {}; }
    let raf = 0, alive = true, last = 0;
    const t0 = performance.now();
    const tick = (now) => {
      if (!alive) return;
      if (now - last > 30) { last = now; s.innerHTML = draw(poseAt(spec, (now - t0) / 1000), spec.props); }
      raf = requestAnimationFrame(tick);

/* Minimal text PDF (Helvetica, A4), built offline with no libraries */
function pdfSafe(s) { return String(s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/·/g, '-').replace(/→/g, '->').replace(/×/g, 'x').replace(/[^\x20-\x7E\xA0-\xFF]/g, ''); }

function makePDF(title, text) {
  const esc2 = (s) => pdfSafe(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const rows = [];
  text.split('\n').forEach((ln, i) => {
    if (i === 0) return;

    const parts = ln ? wrapLine(ln, head ? 80 : 98) : [''];
    parts.forEach((p, j) => rows.push({ t: (j && ln.startsWith('- ') ? '  ' : '') + p, b: head }));
  });
  const perPage = 56; const pages = [];
  for (let i = 0; i < rows.length; i += perPage) pages.push(rows.slice(i, i + perPage));
  if (!pages.length) pages.push([]);
  const objs = []; const add = (s) => { objs.push(s); return objs.length; };
  add('<< /Type /Catalog /Pages 2 0 R >>'); add('PAGES');
  const f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids = [];
  pages.forEach((pg, pi) => {
    let c = '0.039 0.071 0.125 rg 0 790 595 52 re f 0.851 0.682 0.31 rg 0 788 595 2.5 re f\n';
    c += `BT /F2 15 Tf 1 1 1 rg 40 808 Td (${esc2(title)}) Tj ET\n`;
    c += `BT /F1 9 Tf 0.75 0.8 0.88 rg 480 808 Td (${esc2('Page ' + (pi + 1) + ' of ' + pages.length)}) Tj ET\n`;
    c += 'BT 0.08 0.1 0.15 rg 40 760 Td 12.8 TL\n';
    pg.forEach((r) => { c += `/${r.b ? 'F2' : 'F1'} ${r.b ? 10.5 : 9.6} Tf (${esc2(r.t)}) Tj T*\n`; });
    c += 'ET\n';
    c += `BT /F1 8 Tf 0.45 0.5 0.58 rg 40 28 Td (${esc2('From Meniscus Rehab Tracker. Entries stay on your device unless you share them.')}) Tj ET`;
    const cs = add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${cs} 0 R >>`));
  });

  let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'; const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map((o) => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  const u = new Uint8Array(out.length); for (let i = 0; i < out.length; i++) u[i] = out.charCodeAt(i) & 255;

  tick: (d) => {

    if (ctx === 'e') { const e = sec(date, 'e') || {}; const st = Object.assign({}, e.st || {}); if (st[d.id] && !d.force) delete st[d.id]; else st[d.id] = 1; setSec(date, 'e', { st }); }
    else if (ctx && ctx.startsWith('s_')) { const s = sec(date, ctx) || {}; const done = Object.assign({}, s.done || {}); if (done[d.id] && !d.force) delete done[d.id]; else done[d.id] = 1; setSec(date, ctx, { done, k: ctx.slice(2), ph: phaseOn(date) }); }
    if (d.close) closeSheet();
    renderView();
  },
  set: (d) => {
    const s = UI.sheet; if (!s) return; const date = UI.date, ctx = s.ctx; const cur = sec(date, ctx) || {};
    const sets = Object.assign({}, cur.sets || {}); const n = +d.n; sets[d.id] = (sets[d.id] || 0) >= n ? n - 1 : n;
    const ex = EX[d.id]; const total = (s.opts && s.opts.sets) || ex.sets || 2;
    const patch = { sets, k: ctx.slice(2), ph: phaseOn(date) };
    if (sets[d.id] >= total) patch.done = Object.assign({}, cur.done || {}, { [d.id]: 1 });
    setSec(date, ctx, patch); renderView();
    if (sets[d.id] >= n && sets[d.id] < total) T.start(segsFor(ex), { k: s.k, title: ex.name });
    else if (sets[d.id] >= total) { toast(`${ex.name} done`); T.r && T.r.meta.k === s.k && T.stop(); }
    s.render();
  },
  load: (d) => {
    const s = UI.sheet; if (!s) return; const ex = EX[d.id]; const date = UI.date, ctx = s.ctx; const cur = sec(date, ctx) || {};
    const loads = Object.assign({}, cur.load || {}); const v = loads[d.id] != null ? loads[d.id] : (lastLoad(d.id) ?? 0);
    loads[d.id] = Math.max(0, Math.round((v + (+d.d) * ex.load.step) * 10) / 10);
    setSec(date, ctx, { load: loads, k: ctx.slice(2), ph: phaseOn(date) }); s.render();
  },
  tgo: (d) => {
    const s = UI.sheet; const ex = EX[d.id]; const date = UI.date;
    const meta = { k: s.k, title: ex.name };
    if (ex.kind === 'ice') { meta.onIce = () => { const e = sec(date, 'e') || {}; setSec(date, 'e', { ice: (e.ice || 0) + 1 }); renderView(); toast('Ice round logged. Now 20 min off.'); }; meta.onDone = () => toast('Ice round done'); }
    else if (ex.kind === 'reps') meta.onDone = () => toast('Rest over. Next set.');
    else meta.onDone = () => { toast(`${ex.name}: timer done`); if (s.ctx === 'q') { ACT.quad({}); } else if (s.ctx && s.ctx !== 'lib') { ACT.tick({ id: d.id, ctx: s.ctx, force: 1 }); if (UI.sheet) UI.sheet.render(); } };
    T.start(segsFor(ex, s.opts), meta);
  },
  tpause: () => T.pause(), tskip: () => T.skip(), tstop: () => T.stop(),
  treopen: () => { const r = T.r; if (!r) return; const [ctx, id] = r.meta.k.split(':'); openExercise(id, ctx, ctx === 'lib'); },
  quad: (d) => { const q = sec(UI.date, 'q') || {}; setSec(UI.date, 'q', { n: (q.n || 0) + 1 }); if (d && d.close) closeSheet(); renderView(); toast('Round logged'); },
  iceAdj: (d) => { const e = sec(UI.date, 'e') || {}; setSec(UI.date, 'e', { ice: Math.max(0, (e.ice || 0) + (+d.n)) }); renderView(); },
  nsaid: (d) => { setSec(UI.date, 'e', { nsaid: +d.v }); renderView(); },
  finish: () => openFinish(),
  saveFinish: () => {
    const F = UI.sheet.form; F.note = ($('#fnote') || {}).value || ''; const key = sessionKeyFor(UI.date);
    const patch = { pain: F.pain, sw: F.sw, note: F.note.slice(0, 400), fin: Date.now(), k: key, ph: phaseOn(UI.date) };
    if (key === 'run') patch.stage = State.plan.runStage;
    setSec(UI.date, 's_' + key, patch); closeSheet(); renderView();
    toast(zoneOf(F.pain, phaseOn(UI.date)) === 0 && !F.sw ? 'Saved. Nicely judged.' : 'Saved. Check how it sits tomorrow morning.');
  },
  swap: () => openSwap(),
  swapTo: (d) => { const planned = WEEK[phaseOn(UI.date)][dowIdx(UI.date)]; if (d.k === planned) delSec(UI.date, 'k'); else setSec(UI.date, 'k', { v: d.k }); closeSheet(); renderView(); },
  planPh: (d) => { UI.planPh = +d.n; renderView(); },
  check: (d) => { const checks = Object.assign({}, State.plan.checks); if (checks[d.id]) delete checks[d.id]; else checks[d.id] = todayKey(); setPlan({ checks }); renderView(); },
  slClear: () => { if (State.plan.slClear) { setPlan({ slClear: false }); renderView(); return; } dialog({ title: 'Physio cleared single-leg work?', text: 'Only tick this if a physio has watched you and said yes. Feeling good on its own doesn’t count.', ok: 'Yes, cleared', onOk: () => { setPlan({ slClear: true }); renderView(); } }); },
  landClear: () => { if (State.plan.landClear) { setPlan({ landClear: false }); renderView(); return; } dialog({ title: 'Physio OK’d landing drills?', text: 'Late Phase 3 only, with daily life comfortable and swelling settled.', ok: 'Yes', onOk: () => { setPlan({ landClear: true }); renderView(); } }); },
  movePhase: (d) => {
    const P = State.plan, next = P.phase + 1;
    const go = (why) => { const t = todayKey(); setPlan({ phase: next, phaseStart: t, hist: P.hist.concat([{ phase: next, start: t, why }]) }); UI.planPh = null; renderView(); toast(`Phase ${next}: ${PHASES[next].name}`); };
    if (d.early) dialog({ title: `Move to Phase ${next} early?`, text: 'Only with your physio’s OK. Moving on early is the most common cause of a flare. Who cleared it?', ok: 'Move on', input: 'e.g. Physio, 2 Dec', onOk: (v) => { if (!v) { toast('Add who cleared it'); return; } go('Early: ' + v); } });
    else dialog({ title: `Move to Phase ${next}?`, text: `All criteria met. Phase ${next} starts today.`, ok: 'Move on', onOk: () => go('Criteria met') });
  },
  stage: (d) => { const n = Math.max(1, Math.min(9, State.plan.runStage + (+d.n))); setPlan({ runStage: n }); renderView(); toast(`Walk-run stage ${n}`); },
  six: (d) => { setPlan({ six: { v: d.v, date: todayKey() } }); renderView(); if (d.v === 'not') toast('Noted. Book in with your GP this week.'); },
  sixBooked: () => { setPlan({ six: Object.assign({}, State.plan.six, { booked: todayKey() }) }); renderView(); },
  tableView: () => { UI.tableView = !UI.tableView; renderView(); },
  weekly: () => openWeekly(),
  saveWeekly: () => { const F = UI.sheet.form; const walk = $('#wWalk').value, kg = $('#wKg').value; setSec(UI.date, 'w', { walk: walk === '' ? null : num(walk, 0, 300, null), st: F.st, easier: ($('#wEasier').value || '').slice(0, 160), kg: kg === '' ? null : num(kg, 30, 250, null) }); closeSheet(); renderView(); toast('Check-in saved'); },
  gait: () => openGait(),
  gaitTick: (d) => { const F = UI.sheet.form; F.note = $('#gNote').value; if (F.f[d.id]) delete F.f[d.id]; else F.f[d.id] = 1; UI.sheet.render(); },
  saveGait: () => { const F = UI.sheet.form; setSec(UI.date, 'g', { f: F.f, note: ($('#gNote').value || '').slice(0, 400) }); closeSheet(); renderView(); toast('Gait check saved'); },
  summary: () => openSummary(),
  copySum: () => copyText($('#sumTxt').value, $('#sumTxt')),
  pdfSum: () => savePDF(),
  copyBk: () => copyText($('#bkTxt').value, $('#bkTxt')),
  exportData: () => exportData(),
  importData: () => openImport(),
  doImport: () => doImport(),
  setup: () => openSetup(),
  saveWelcome: () => { keepText(); const F = UI.sheet.form; const s = okDate(F.start) ? F.start : todayKey(); setPlan({ side: F.side === 'right' ? 'right' : 'left', notes: String(F.notes || '').slice(0, 600), ack: true, start: s, phaseStart: s, hist: [{ phase: 1, start: s, why: 'Started' }] }); closeSheet(); renderView(); toast('All set. Start with the morning check.'); },
  saveSetup: () => {
    keepText(); const F = UI.sheet.form, P = State.plan;
    const patch = { sound: !!+F.sound, iceTarget: num(F.ice, 7, 365, P.iceTarget) | 0, side: F.side === 'right' ? 'right' : 'left', notes: String(F.notes || '').slice(0, 600) };
    if (okDate(F.start)) patch.start = F.start;
    if (okDate(F.phaseStart)) patch.phaseStart = F.phaseStart;
    const ps = patch.phaseStart || P.phaseStart;
    if (+F.phase !== P.phase || ps !== P.phaseStart) { patch.phase = +F.phase; const hist = P.hist.filter((h) => h.start < ps); hist.push({ phase: +F.phase, start: ps, why: 'Set in settings' }); patch.hist = hist; }
    setPlan(patch); closeSheet(); renderView(); toast('Settings saved');
  },
  wipe: () => dialog({ title: 'Erase all data?', text: 'This clears every entry in this browser. Back up first if you might want them.', ok: 'Erase everything', danger: true, onOk: () => {
    State = { v: 1, plan: defaultPlan(), days: {} };
    saveLocal(true); closeSheet(true); UI.date = todayKey(); renderView(); toast('Erased'); openWelcome();
  } }),
};
function keepText() { const s = UI.sheet; if (!s || !s.form) return; document.querySelectorAll('#sb [data-k]').forEach((el) => { s.form[el.dataset.k] = el.value; }); const n = $('#fnote'); if (n) s.form.note = n.value; const g = $('#gNote'); if (g) s.form.note = g.value; }
function setHurt(id, ctx, on) {
  const date = UI.date;
  if (ctx === 'e') { const e = sec(date, 'e') || {}; const hurt = Object.assign({}, e.hurt || {}); if (on) hurt[id] = 1; else delete hurt[id]; setSec(date, 'e', { hurt }); }
  else if (ctx && ctx.startsWith('s_')) { const s = sec(date, ctx) || {}; const hurt = Object.assign({}, s.hurt || {}); if (on) hurt[id] = 1; else delete hurt[id]; setSec(date, ctx, { hurt, k: ctx.slice(2), ph: phaseOn(date) }); }
  renderView(); if (UI.sheet) UI.sheet.render();
  if (on) toast('Flagged. Use a smaller range or the easier option next time.');
}

/* ===== Boot ===== */
function boot() {
  loadLocal();
  document.body.insertAdjacentHTML('afterbegin', Fig.defs());
  $('#app').innerHTML = `<header class="top"><div class="wrap">${MARK}<div class="brand"><b>Meniscus Rehab</b><span id="topSub"></span></div><button class="iconbtn" data-a="setup" aria-label="Settings and data">${ic('gear')}</button></div></header>
    <main><div class="wrap" id="view"></div></main>
    <nav class="tabs" aria-label="Sections"><div class="wrap">${[['today', 'Today'], ['plan', 'Plan'], ['log', 'Log'], ['guide', 'Guide']].map(([t, l]) => `<button class="tab" data-a="tab" data-t="${t}" data-tab="${t}">${ic(t)}${l}</button>`).join('')}</div></nav>`;
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; const fn = ACT[b.dataset.a]; if (fn) { e.preventDefault(); fn(b.dataset, b, e); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && UI.sheet && !UI.sheet.noClose) closeSheet(); });
  const h = (location.hash || '').slice(1);
  UI.tab = ['today', 'plan', 'log', 'guide'].includes(h) ? h : 'today';
  window.addEventListener('hashchange', () => { const x = (location.hash || '').slice(1); if (['today', 'plan', 'log', 'guide'].includes(x) && x !== UI.tab) { UI.tab = x; renderView(); } });
  renderView();
  if (!State.plan.ack) openWelcome();
  let lastDay = todayKey();
  setInterval(() => { const t = todayKey(); if (t !== lastDay) { if (UI.date === lastDay) UI.date = t; lastDay = t; renderView(); } }, 60000);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    const reg = () => navigator.serviceWorker.register('sw.js').catch(() => {});
    if (document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
